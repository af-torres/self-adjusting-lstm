[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-lstm"
version = "0.0.1"
description = "A real time lstm architecture with self-tunning hyper-parameters"
readme = "README.md"
authors = [
    {name = "Andres Torres", email = "andres.torres@uri.edu"},
]
license = {text = "MIT"}

requires-python = ">=3.11"
dependencies = [
    "keras==3.5.0",
    "tensorflow==2.17.0",
    "scipy==1.14.1",
    "scikit-learn==1.5.1",
    "pandas==2.2.2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["*.tests*"]
